<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Cricket Dash</title>
<style>
  html, body { margin:0; height:100%; background:#000; overflow:hidden; -webkit-user-select:none; user-select:none; }
  body { display:flex; align-items:center; justify-content:center; }
  svg { width:100vw; height:100vh; display:block; }
  text { font-family:"Avenir Next Condensed","Helvetica Neue",Arial,sans-serif; font-weight:700; fill:#e8e8e8; }
  .it { font-style:italic; }
  .dim { fill:#85888c; }
  .tap { cursor:pointer; }
  #overlay { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
             background:rgba(0,0,0,.72); color:#e8e8e8; font:700 22px "Avenir Next Condensed",sans-serif; letter-spacing:.08em; }
  #overlay small { margin-top:10px; font-size:13px; color:#9a9a9a; letter-spacing:.02em; font-weight:500; text-align:center; padding:0 20px; }
  #overlay.hidden { display:none; }
  /* ---- diagnostics panel (long-press the clock, or open with ?diag) ---- */
  #diag { position:fixed; inset:0; background:rgba(5,6,7,.96); color:#e8e8e8; display:none; flex-direction:column;
          font:500 13px -apple-system,system-ui,sans-serif; padding:10px; padding-top:max(10px,env(safe-area-inset-top)); box-sizing:border-box; z-index:10; }
  #diag.open { display:flex; }
  #diag h2 { margin:0 0 6px; font:700 16px "Avenir Next Condensed",sans-serif; letter-spacing:.05em; }
  #diag .row { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:6px; }
  #diag button { font:600 14px -apple-system,system-ui,sans-serif; padding:9px 12px; border:0; border-radius:8px; background:#2b2d30; color:#e8e8e8; }
  #diag button.go { background:#318193; color:#fff; }
  #diag #dgStatus { color:#9a9a9a; margin-bottom:6px; min-height:1.2em; }
  #diag #dgOut { flex:1; overflow:auto; background:#0d0e10; border:1px solid #2b2d30; border-radius:8px; padding:8px;
                 font:12px ui-monospace,Menlo,monospace; white-space:pre; -webkit-user-select:text; user-select:text; }
  #diag table { border-collapse:collapse; font:12px ui-monospace,Menlo,monospace; }
  #diag td, #diag th { border:1px solid #2b2d30; padding:3px 6px; text-align:right; }
  #diag th { color:#9a9a9a; font-weight:600; }
</style>
</head>
<body>
<svg id="dash" viewBox="0 0 800 420" preserveAspectRatio="xMidYMid meet"></svg>
<div id="overlay"><div>TAP TO CONNECT</div><small id="ovmsg">Close the TruMoto app first. Turn phone sideways.</small></div>
<div id="diag">
  <h2>DIAGNOSTICS — per-mode config</h2>
  <div class="row">
    <button id="dgConnect">Connect</button>
    <button id="dgRead" class="go">Read config</button>
    <button id="dgClear">Clear</button>
    <button id="dgCopy">Copy report</button>
    <button id="dgClose">Close</button>
  </div>
  <div id="dgStatus">Set the throttle switch, tap Read config. Repeat for each mode (A, B, C).</div>
  <div id="dgOut"></div>
</div>

<script>
// ======================= CONFIG (from your controller's motor config) =======================
const MOTOR_POLES = 8;        // 8 poles = 4 pole pairs  -> motor RPM = eRPM / 4
const GEAR_RATIO  = 6.077;    // motor : wheel
const WHEEL_DIA_M = 0.405;    // metres
const CELLS       = 21;       // 21s pack
const RPM_MAX     = 10000;    // end of RPM bar (motor RPM); motor max is ~9,500 unloaded
const RPM_RED     = 9000;     // start of red zone
const WARN_FET_C  = 80, WARN_MOTOR_C = 100;  // warning thresholds
const POLL_MS     = 100;
const POWER_MAX_KW = 14;      // power bar full   (~180 A x 76 V)
const REGEN_MAX_KW = 4;       // regen bar full
const BATT_EMPTY_PCT = 5;     // battery bar reads empty here (5% = 3.3 V/cell = 69.3 V on 21s)
const MODE_NAMES  = {1:'C', 2:'B', 3:'A'};   // throttle switch position -> label
const DEV_MODE    = false || new URLSearchParams(location.search).has('dev');   // true (or open with ?dev) = skip 'tap to connect' so the UI can be used in a desktop browser
const DEV_SELFTEST = false;  // dev only: true = power-on self-test look (all 8s, every bar full, every chip on); false = blank readouts

// ======================= BLE / PROTOCOL =======================
const NUS    = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
const NUS_RX = '6e400002-b5a3-f393-e0a9-e50e24dcca9e';
const NUS_TX = '6e400003-b5a3-f393-e0a9-e50e24dcca9e';
// TruMoto shifts standard VESC command IDs by +62. READ-ONLY commands only.
const CMD_FW_VERSION = 0x3E, CMD_GET_VALUES = 0x42;

function crc16(bytes){let c=0;for(const b of bytes){c^=b<<8;for(let i=0;i<8;i++)c=(c&0x8000)?((c<<1)^0x1021)&0xffff:(c<<1)&0xffff;}return c;}
function frame(p){p=Uint8Array.from(p);const c=crc16(p);return Uint8Array.from([2,p.length,...p,c>>8,c&255,3]);}
const PKT_FW = frame([CMD_FW_VERSION]), PKT_VALUES = frame([CMD_GET_VALUES]);
// diagnostics only — also read-only; these are the same requests the TruMoto app sends when it connects
const CMD_GET_MCCONF = 0x4C, CMD_GET_APPCONF = 0x4F;   // std 0x0E / 0x11
const PKT_MCCONF = frame([CMD_GET_MCCONF]), PKT_APPCONF = frame([CMD_GET_APPCONF]);

// ======================= SETTINGS (tap to toggle, remembered) =======================
const store = { get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v);}catch{return d;}},
                set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch{}} };
let useKmh = store.get('kmh', false), useF = store.get('degF', false);

// ======================= DRAW THE DASH =======================
const NS = 'http://www.w3.org/2000/svg';
const svg = document.getElementById('dash');
function el(tag, attrs, parent=svg){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);parent.appendChild(e);return e;}
function txt(x,y,s,attrs={},parent=svg){const t=el('text',{x,y,...attrs},parent);t.textContent=s;return t;}

// screen frame
el('rect',{x:6,y:4,width:788,height:412,rx:18,fill:'#050607',stroke:'#1c1f22','stroke-width':3});

// --- top status bar ---
el('rect',{x:40,y:10,width:720,height:34,fill:'none',stroke:'#85888c','stroke-width':1.5});
const chipBT = chip(48,14,'BT'), chipRegen = chip(100,14,'REGEN'), chipFault = chip(184,14,'FAULT');
chipFault.box.setAttribute('fill','#d32f2f'); chipFault.label.setAttribute('fill','#fff');
const warnTxt = txt(470,35,'',{'text-anchor':'middle','font-size':20,fill:'#e53935'}); warnTxt.style.fill='#e53935';
const clockTxt = txt(750,36,'--:--',{'text-anchor':'end','font-size':24});
function chip(x,y,label){const g=el('g',{});const w=label.length*12+16;
  const box=el('rect',{x,y,width:w,height:26,fill:'#e8e8e8'},g);
  const t=txt(x+w/2,y+20,label,{'text-anchor':'middle','font-size':18},g); t.style.fill='#000';
  g.style.display='none'; return {g,box,label:t,show(v){g.style.display=v?'':'none';}};}

// --- RPM bar (R1 style) ---
txt(42,64,'×1000 r/min',{'font-size':17});
// One continuous sweep across x = TX0..TX1. Segments are cut with vertical sides.
// Top edge drops gently on the left; bottom edge sweeps up strongly, so the left strips are tall and the right blocks short.
const TX0=40, TX1=760, TW=TX1-TX0;   // tach spans the same width as the top/bottom banners
const yTopAt = x => { const s=(x-TX0)/TW; return  72 +  89*Math.exp(-s/0.12); };   // right end raised (was 97); left end unchanged at 161
const yBotRef = x => { const s=(x-TX0)/TW; return 106 + 147*Math.exp(-s/0.17); };
const TACH_H = yBotRef(TX1) - yTopAt(TX1) + 6;         // bar height: right-most bar standard (~34) + 6
const yBotAt = x => yTopAt(x) + TACH_H;                // every bar the same height all the way across
// rpm -> x: low numbers bunched on the sweep (R1 spacing for 0-5k), then evenly spaced across the flat top
const RPM_T = [[0,0],[1000,.015],[2000,.05],[3000,.083],[4000,.13],[5000,.19]];
function xAt(rpm){
  rpm=Math.max(0,Math.min(RPM_MAX,rpm));
  for(let i=1;i<RPM_T.length;i++){ const [r1,t1]=RPM_T[i],[r0,t0]=RPM_T[i-1];
    if(rpm<=r1) return TX0+TW*(t0+(t1-t0)*(rpm-r0)/(r1-r0)); }
  const [rL,tL]=RPM_T[RPM_T.length-1];
  return TX0+TW*(tL+(1-tL)*(rpm-rL)/(RPM_MAX-rL));
}
function rpmAt(x){ let lo=0,hi=RPM_MAX; for(let i=0;i<30;i++){const m=(lo+hi)/2; if(xAt(m)<x) lo=m; else hi=m;} return lo; }
// segment layout (explicit widths, left to right):
//   bars 1-5  : narrow strips on the sweep (as tuned)
//   bars 6-10 : double-width blocks (2 x a standard top block)
//   the rest  : standard top blocks filling out to the end; the last 4 are the red zone
const SEG_GAP=2.2, segBounds=[];
const FIRST_BAR_EXTRA = 28;   // extra bar height at the far left, tapering to 0 at the far right
const BLOCK_W = (TX1 - xAt(5000)) / 20;               // standard top block width (as it was)
{ const W1 = 0.6*(xAt(5000)-TX0)/7.85;               // bar 1 width (unchanged)
  const W7 = 2*BLOCK_W;                                // bar 7 width (double block)
  const widths = [];
  for(let k=0;k<6;k++) widths.push(W1*Math.pow(W7/W1, k/6));   // bars 1-6 grow smoothly toward bar 7
  for(let k=0;k<4;k++) widths.push(W7);                // bars 7-10
  // bars 11-18 shrink smoothly from bar 10's width down to bar 19's; bars 19-22 (red zone) are equal.
  // Bar 19's width E is solved so everything fits exactly to the end of the tach.
  const used = widths.reduce((a,b)=>a+b,0), room = TW-used;
  const tailWidths = E => { const w=[]; for(let k=1;k<=8;k++) w.push(W7*Math.pow(E/W7,k/9)); for(let k=0;k<4;k++) w.push(E); return w; };
  let lo=1, hi=W7; for(let i=0;i<50;i++){ const m=(lo+hi)/2, tot=tailWidths(m).reduce((a,b)=>a+b,0); if(tot>room) hi=m; else lo=m; }
  widths.push(...tailWidths(lo));
  let xx=TX0; for(const w of widths){ segBounds.push(xx); xx+=w; } segBounds.push(TX1);
}
const RED_SEGS = 4;                                    // last 4 blocks are red
const segs=[];
for(let k=0;k<segBounds.length-1;k++){
  const xa=segBounds[k]+SEG_GAP/2, xb=segBounds[k+1]-SEG_GAP/2;
  // follow the curves along the top and bottom edges (sampled every ~1.5 units) so wide blocks stay smooth
  const nS=Math.max(2,Math.ceil((xb-xa)/1.5)), pts=[];
  for(let i=0;i<=nS;i++){ const x=xa+(xb-xa)*i/nS; pts.push([x,yTopAt(x)]); }
  // extra bar height tapers smoothly from FIRST_BAR_EXTRA at the left end to 0 by the start of the 10th bar
  const tEnd = segBounds[9];   // start of the 10th bar
  for(let i=nS;i>=0;i--){ const x=xa+(xb-xa)*i/nS; const u=Math.min(1,(x-TX0)/(tEnd-TX0)); pts.push([x,yBotAt(x)+FIRST_BAR_EXTRA*(1-u)*(1-u)]); }   // eases out to 0 (no kink at the end) without bulging on the left
  const p=el('polygon',{points:pts.map(q=>q.map(v=>v.toFixed(1)).join(',')).join(' ')});
  segs.push({p, rpm:rpmAt(segBounds[k]), red: k >= segBounds.length-1-RED_SEGS});
}
// numbers sit just above the top edge, pushed out along its normal
for(let r=1000;r<=RPM_MAX;r+=1000){
  const END=segBounds.length-1;   // 4..10 sit on block gaps, two blocks apart, counted back from the end
  const LABEL_GAP = {4000:END-14, 5000:END-12, 6000:END-10, 7000:END-8, 8000:END-6, 9000:END-4, 10000:END-2};
  const LABEL_X = {1000: segBounds[2], 2000: segBounds[4], 3000: segBounds[6]};   // labels pinned to gaps between strips: 1 (2nd|3rd), 2 (4th|5th), 3 (6th|7th)
  const x=LABEL_X[r] ?? segBounds[LABEL_GAP[r]], y=yTopAt(x),
 dy=(yTopAt(x+1)-yTopAt(x-1))/2, n=Math.hypot(1,dy);
  const LABEL_OFF=9;                       // distance of numbers from the tach edge
  const ox=dy/n*LABEL_OFF, oy=-1/n*LABEL_OFF;   // along the normal pointing up / up-left
  const small = x < xAt(5000)-1;   // smaller labels only on the sweep
  const t=txt(x+ox, y+oy+(small?2:6), String(r/1000),{'text-anchor':'middle','font-size':20,class:'it'});
  t.style.fontWeight='900';   // bold tach numbers
  if(r>=RPM_RED) t.style.fill='#e53935';
}
function setRpm(rpm){
  segs.forEach(s=>{const on = rpm > s.rpm + 1;
    s.p.setAttribute('fill', s.red ? (on?'#ff3b30':'#b71c1c') : (on?'#ececec':'#2b2d30'));});
}

// --- speed: R1-style digits — continuous stroke, upright, generously rounded corners ---
// rc = corner radius on the stroke's centre line: outer corners round off at rc + t/2, inner at rc - t/2
const DIG={w:82,h:92,t:13.5,rc:10,gap:12}, SPEED_X=282, SPEED_Y=168;
function roundedPolyline(pts, closed, r=DIG.rc){
  const n=pts.length, P=i=>pts[(i+n)%n];
  const cut=(a,b,d)=>{const dx=b[0]-a[0],dy=b[1]-a[1],L=Math.hypot(dx,dy)||1,k=Math.min(d,L/2)/L;return [a[0]+dx*k,a[1]+dy*k];};
  let d='';
  if(closed){
    const s0=cut(P(0),P(1),r); d+=`M${s0[0]},${s0[1]}`;
    for(let i=1;i<=n;i++){ const v=P(i), a=cut(v,P(i-1),r), b=cut(v,P(i+1),r); d+=` L${a[0]},${a[1]} Q${v[0]},${v[1]} ${b[0]},${b[1]}`; }
    return d+' Z';
  }
  d+=`M${pts[0][0]},${pts[0][1]}`;
  for(let i=1;i<n-1;i++){ const v=pts[i], a=cut(v,pts[i-1],r), b=cut(v,pts[i+1],r); d+=` L${a[0]},${a[1]} Q${v[0]},${v[1]} ${b[0]},${b[1]}`; }
  return d+` L${pts[n-1][0]},${pts[n-1][1]}`;
}
const ONE_FLAG = 0.19;   // length of the 1's top flag, as a fraction of digit width
function digitPath(ch, D=DIG){
  const c=D.t/2, L=c, R=D.w-c, T=c, B=D.h-c, M=D.h/2;
  // open strokes: push both loose ends out by half a stroke so they reach the digit's edge like the rest
  const ext=(a,b)=>{const dx=a[0]-b[0],dy=a[1]-b[1],L=Math.hypot(dx,dy)||1;return [a[0]+dx/L*c,a[1]+dy/L*c];};
  const o=(...p)=>{ p=p.map(q=>q.slice()); p[0]=ext(p[0],p[1]); p[p.length-1]=ext(p[p.length-1],p[p.length-2]); return roundedPolyline(p,false,D.rc); };
  const z=(...p)=>roundedPolyline(p,true,D.rc);
  return ({
    '0': z([L,T],[R,T],[R,B],[L,B]),
    '1': o([R-ONE_FLAG*D.w,T],[R,T],[R,B]),            // flag scales with digit width
    '2': o([L,T],[R,T],[R,M],[L,M],[L,B],[R,B]),
    '3': o([L,T],[R,T],[R,B],[L,B]) + ' ' + o([L+0.16*D.w,M],[R,M]),   // middle bar inset scales too
    '4': o([L,T],[L,M],[R,M]) + ' ' + o([R,T],[R,B]),
    '5': o([R,T],[L,T],[L,M],[R,M],[R,B],[L,B]),
    '6': o([R,T],[L,T],[L,B],[R,B],[R,M],[L,M]),
    '7': o([L,T],[R,T],[R,B]),
    '8': z([L,T],[R,T],[R,B],[L,B]) + ' ' + o([L,M],[R,M]),
    '9': o([R,M],[L,M],[L,T],[R,T],[R,B],[L,B]),
    ' ': '',
  })[ch];
}
const digits=[];
for(let d=0;d<3;d++){
  const g=el('g',{transform:`translate(${SPEED_X+d*(DIG.w+DIG.gap)},${SPEED_Y})`});
  digits.push(el('path',{d:'',fill:'none',stroke:'#ececec','stroke-width':DIG.t,'stroke-linejoin':'round','stroke-linecap':'butt'},g));
}
function setDigits(n){
  const s=String(Math.max(0,Math.min(999,Math.round(n)))).padStart(3,' ');
  digits.forEach((p,i)=>p.setAttribute('d',digitPath(s[i])));
}
const unitTxt = txt(SPEED_X+3*(DIG.w+DIG.gap)+2, SPEED_Y+DIG.h, '', {'font-size':24,class:'tap'});
unitTxt.style.fill='#85888c'; unitTxt.style.fontWeight='500';   // grey, lighter weight
const speedG=el('g',{class:'tap',style:'user-select:none;-webkit-user-select:none;-webkit-touch-callout:none'});
el('rect',{x:SPEED_X-4,y:SPEED_Y-4,width:3*(DIG.w+DIG.gap)+60,height:DIG.h+8,fill:'transparent'},speedG);   // invisible touch box over the speed
digits.forEach(p=>speedG.appendChild(p.parentNode)); speedG.appendChild(unitTxt);

// --- power box (where the R1 shows gear) ---
const PB={dx:22, dy:-22};   // power box offset (moved up/right to sit just under the speed)
const pbG=el('g',{});      // shifted at startup so its right edge lands just past the 'h' of 'mph'
el('rect',{x:352+PB.dx,y:290+PB.dy,width:196,height:92,fill:'none',stroke:'#85888c','stroke-width':1.5},pbG);   // bottom edge just above the bottom banner
const pwrLbl=txt(362+PB.dx,314+PB.dy,'Power',{'font-size':20,class:'dim'},pbG); pwrLbl.style.fontWeight='600';   // same size as 'mph', slightly heavier
// kW value drawn with the speed's digit style, scaled to the old text size (right-aligned at the same spot)
const KW_H = 44;   // digit height in the Power box
const KW_DIG = {h:KW_H, w:KW_H*DIG.w/DIG.h, t:KW_H*DIG.t/DIG.h, rc:KW_H*DIG.rc/DIG.h, gap:5};
const kwG = el('g',{},pbG), KW_RIGHT = 504+PB.dx, KW_BASE = 373+PB.dy;   // bottom-aligned with 'kW'
function setKw(str){
  kwG.innerHTML=''; const D=KW_DIG, dotW=D.t*1.6; let x=KW_RIGHT;
  for(const ch of [...str].reverse()){
    if(ch==='.'){ x-=dotW; el('rect',{x:x+(dotW-D.t)/2,y:KW_BASE-D.t,width:D.t,height:D.t,rx:D.t*0.25,fill:'#ececec'},kwG); x-=D.gap*0.4; continue; }
    const adv = ch==='1' ? ONE_FLAG*D.w + D.t : D.w;          // '1' takes only the space it needs here (no LCD gap)
    x-=adv; const g=el('g',{transform:`translate(${(x-(D.w-adv)).toFixed(1)},${KW_BASE-D.h})`},kwG);
    const d = ch==='-' ? `M${D.t/2},${D.h/2} H${D.w-D.t/2}` : digitPath(ch,D);
    if(d) el('path',{d,fill:'none',stroke:'#ececec','stroke-width':D.t,'stroke-linejoin':'round','stroke-linecap':'butt'},g);
    x-=D.gap;
  }
}
setKw('0.0');
// battery icon: solid white vertical battery with a see-through lightning bolt (moves with the Power box)
{ const w=16, h=30, r=3, nubW=7, nubH=3.5, bx=352+PB.dx+196+20, byBot=290+PB.dy+92-5;   // 5 up from the box bottom
  const bi=el('g',{transform:`translate(${bx},${byBot-h})`},pbG);
  const body=`M${r},0 H${w-r} Q${w},0 ${w},${r} V${h-r} Q${w},${h} ${w-r},${h} H${r} Q0,${h} 0,${h-r} V${r} Q0,0 ${r},0 Z`;
  const bolt=`M${w*0.62},${h*0.13} L${w*0.24},${h*0.57} H${w*0.5} L${w*0.4},${h*0.89} L${w*0.78},${h*0.43} H${w*0.52} L${w*0.69},${h*0.13} Z`;
  el('path',{d:body+' '+bolt,'fill-rule':'evenodd',fill:'#ececec'},bi);                         // bolt is cut out (clear)
  el('rect',{x:(w-nubW)/2,y:-nubH,width:nubW,height:nubH+0.5,rx:1,fill:'#ececec'},bi);           // terminal
}
txt(540+PB.dx,373+PB.dy,'kW',{'text-anchor':'end','font-size':24,style:'font-weight:500',class:'dim'},pbG);
// line the power box's right edge up just past the end of 'mph'
{ const keep=unitTxt.textContent; unitTxt.textContent='mph';
  try{ const bb=unitTxt.getBBox(), right=bb.x+bb.width+7, boxRight=352+PB.dx+196;
       pbG.setAttribute('transform',`translate(${(right-boxRight).toFixed(1)},0)`); }catch{}
  unitTxt.textContent=keep; }

// --- left readouts (temps & volts) ---
const READ_SHIFT={x:-52,y:12};   // whole table (both pages + touch box): left/down from its original spot
const readG=el('g',{class:'tap',transform:`translate(${READ_SHIFT.x},${READ_SHIFT.y})`,style:'user-select:none;-webkit-user-select:none;-webkit-touch-callout:none'});
el('rect',{x:96,y:216,width:236,height:132,fill:'transparent'},readG);   // invisible touch box over the 4 rows
const readA=el('g',{},readG), readB=el('g',{},readG);                     // page A = live data, page B = alt data
txt(104,240,'BATT',{'font-size':18,style:'font-weight:600'},readA); const socTxt=txt(300,242,'--',{'text-anchor':'end','font-size':26,style:'font-weight:600',class:'it'},readA); txt(306,242,'%',{'font-size':14,class:'dim'},readA);

function setFill(f, frac){

const POLE_PAIRS = MOTOR_POLES/2, WHEEL_CIRC = Math.PI*WHEEL_DIA_M;
const motorRpm = erpm => Math.abs(erpm)/POLE_PAIRS;
const speedMs  = erpm => motorRpm(erpm)/GEAR_RATIO*WHEEL_CIRC/60;
const tachToM  = t => t/(MOTOR_POLES*3)/GEAR_RATIO*WHEEL_CIRC;   // VESC tacho counts 6 per e-rev
const SOC_LUT=[[3.0,0],[3.3,5],[3.5,15],[3.6,28],[3.7,48],[3.8,64],[3.9,77],[4.0,87],[4.1,95],[4.2,100]];
function soc(vPack){const v=vPack/CELLS; if(v<=SOC_LUT[0][0])return 0;
  for(let i=1;i<SOC_LUT.length;i++){const [v1,p1]=SOC_LUT[i],[v0,p0]=SOC_LUT[i-1];
    if(v<=v1) return p0+(p1-p0)*(v-v0)/(v1-v0);} return 100;}

let tripStartTach=null, socSmooth=null, last=null, regenF=0, powerF=0;
function render(v){
  last=v;
  const rpm=motorRpm(v.erpm), ms=speedMs(v.erpm);
  setRpm(rpm);
  setDigits(useKmh ? ms*3.6 : ms*2.23694);
  unitTxt.textContent = useKmh?'km/h':'mph';
  setKw((v.vin*v.iIn/1000).toFixed(1));
  voltTxt.textContent = v.vin.toFixed(1);
  mtTxt.textContent = Math.round(temp(v.tMot)); ctTxt.textContent = Math.round(temp(v.tFet));
  mtU.textContent = ctU.textContent = useF?'°F':'°C'; layoutMt();
  // battery: smooth so it doesn't jump with voltage sag
  const s=soc(v.vin); socSmooth = socSmooth===null ? s : socSmooth + (s-socSmooth)*0.02;
  socTxt.textContent = Math.round(socSmooth);
  setBatt((socSmooth-BATT_EMPTY_PCT)/(100-BATT_EMPTY_PCT));   // bar = usable 'fuel': full at 100%, empty at 5%
  // trip since connect
  if(tripStartTach===null) tripStartTach=v.tachAbs;
  const m=tachToM(v.tachAbs-tripStartTach);
  tripTxt.textContent = (useKmh? m/1000 : m/1609.344).toFixed(2); tripU.textContent = useKmh?'km':'mi';
  ampTxt.textContent = Math.round(v.iIn); phaseTxt.textContent = Math.round(v.iMot); whTxt.textContent = v.wh.toFixed(1); rgnTxt.textContent = v.whc.toFixed(1);
  modeTxt.textContent = 'MODE-'+(MODE_NAMES[v.mode]??'–');
  // power / regen fills (light smoothing so they move like a gauge)
  const kwNow = v.vin*v.iIn/1000;
  powerF += ((kwNow>0 ?  kwNow/POWER_MAX_KW : 0) - powerF)*0.35;
  regenF += ((kwNow<0 ? -kwNow/REGEN_MAX_KW : 0) - regenF)*0.35;
  setFill(FILL.power, powerF); setFill(FILL.regen, regenF);
  chipRegen.show(v.iIn < -0.5);
  chipFault.show(v.fault!==0);
  warnTxt.textContent = v.fault!==0 ? FAULTS[v.fault]||('FAULT '+v.fault)
                      : (v.tFet>=WARN_FET_C ? 'CONTROLLER HOT' : v.tMot>=WARN_MOTOR_C ? 'MOTOR HOT' : '');
}

function onNotify(e){const c=new Uint8Array(e.target.value.buffer);const m=new Uint8Array(rxBuf.length+c.length);m.set(rxBuf);m.set(c,rxBuf.length);rxBuf=m;parse();}
function parse(){
  while(rxBuf.length){
    const st=rxBuf[0]; if(st!==2&&st!==3){rxBuf=rxBuf.slice(1);continue;}
    const hdr=st===2?2:3; if(rxBuf.length<hdr)return;
    const len=st===2?rxBuf[1]:(rxBuf[1]<<8)|rxBuf[2], tot=hdr+len+3; if(rxBuf.length<tot)return;
    const p=rxBuf.slice(hdr,hdr+len), crc=(rxBuf[hdr+len]<<8)|rxBuf[hdr+len+1];
    if(rxBuf[hdr+len+2]===3&&crc===crc16(p)){rxBuf=rxBuf.slice(tot);handle(p);} else rxBuf=rxBuf.slice(1);
  }
}
function handle(p){
  const dv=new DataView(p.buffer,p.byteOffset,p.byteLength);
  if(p[0]===CMD_GET_MCCONF || p[0]===CMD_GET_APPCONF){ DIAG.onReply(p); return; }
  if(p[0]===CMD_FW_VERSION){let n='',i=3;while(i<p.length&&p[i])n+=String.fromCharCode(p[i++]);fwTxt.textContent=n;}
  else if(p[0]===CMD_GET_VALUES){
    busy=false; let o=1;
    const i16=s=>{const v=dv.getInt16(o)/s;o+=2;return v;}, i32=s=>{const v=dv.getInt32(o)/s;o+=4;return v;};
    render({tFet:i16(10),tMot:i16(10),iMot:i32(100),iIn:i32(100),id:i32(100),iq:i32(100),duty:i16(1000),erpm:i32(1),
            vin:i16(10),ah:i32(1e4),ahc:i32(1e4),wh:i32(1e4),whc:i32(1e4),tach:i32(1),tachAbs:i32(1),fault:p[o],
            mode:p.length>=75?p[p.length-1]:null});  // TruMoto extra byte: throttle switch position 1-3
    DIAG.mode = p.length>=75 ? p[p.length-1] : null;
  }
}
async function poll(){ if(busy){busy=false;return;} busy=true; try{await rx.writeValue(PKT_VALUES);}catch(e){} }

async function connect(){

    device.addEventListener('gattserverdisconnected',onDisconnected);

    rx=await svc.getCharacteristic(NUS_RX);
    const tx=await svc.getCharacteristic(NUS_TX);

  // known motor-config fields (byte offset in the reply, counting the command byte as 0) — VESC 6.05 layout
  const MC_FIELDS=[
    {off:9,  name:'Motor current max',    unit:'A'},
    {off:13, name:'Motor current min (brake)', unit:'A'},
    {off:17, name:'Battery current max',  unit:'A'},
    {off:21, name:'Battery current min (regen)', unit:'A'},
  ];
  const f32=(u8,o)=> o+4<=u8.length ? new DataView(u8.buffer,u8.byteOffset,u8.byteLength).getFloat32(o) : NaN;
  const hex=(u8,a,b)=>Array.from(u8.slice(a,b),x=>x.toString(16).padStart(2,'0')).join(' ');
  const modeLabel=m=> m==null ? '?' : (MODE_NAMES[m] ? 'MODE-'+MODE_NAMES[m] : 'mode '+m);
  const setStatus=t=>status.textContent=t;

  function request(cmd,pkt){
    return new Promise((resolve,reject)=>{
      if(!rx || !device?.gatt?.connected) return reject(new Error('not connected'));
      pending={cmd,resolve,timer:setTimeout(()=>{pending=null;reject(new Error('no reply to 0x'+cmd.toString(16)));},3000)};
      rx.writeValue(pkt).catch(e=>{clearTimeout(pending?.timer);pending=null;reject(e);});
    });
  }
  function onReply(p){
    if(pending && p[0]===pending.cmd){ clearTimeout(pending.timer); const r=pending.resolve; pending=null; r(p); }
  }

  async function read(){
    try{
      setStatus('Reading motor config…');  const mc=await request(CMD_GET_MCCONF,PKT_MCCONF);
      setStatus('Reading app config…');    const ap=await request(CMD_GET_APPCONF,PKT_APPCONF);
      const mode=api.mode, label=modeLabel(mode);
      const i=snaps.findIndex(s=>s.mode===mode && mode!=null);
      const snap={mode,label,mc,ap,t:new Date()};
      if(i>=0) snaps[i]=snap; else snaps.push(snap);
      setStatus(`Saved ${label} (motor ${mc.length} B, app ${ap.length} B). ${snaps.length} mode(s) captured — switch modes and read again.`);
      draw();
    }catch(e){ setStatus('Error: '+e.message); }
  }

  // byte ranges that differ between any snapshots (gaps of <=3 equal bytes are merged)
  function diffRanges(key){
    if(snaps.length<2) return [];
    const n=Math.min(...snaps.map(s=>s[key].length)); const diff=[];
    for(let i=0;i<n;i++) if(snaps.some(s=>s[key][i]!==snaps[0][key][i])) diff.push(i);
    const rs=[]; for(const i of diff){ const r=rs[rs.length-1]; if(r && i-r.b<=3) r.b=i; else rs.push({a:i,b:i}); }
    return rs;
  }
  // plausible float readings for a changed range (4-byte windows touching it)
  function floatGuesses(key,r){
    const out=[];
    for(let o=r.a-3;o<=r.b;o++){ if(o<1) continue;
      const vals=snaps.map(s=>f32(s[key],o));
      if(vals.every(v=>Number.isFinite(v) && (v===0 || (Math.abs(v)>1e-4 && Math.abs(v)<1e6))) && new Set(vals.map(v=>v.toPrecision(6))).size>1)
        out.push({o,vals});
    }
    return out;
  }

  function report(){
    let t='Noisy Cricket per-mode config diagnostics\n'+(fwTxt.textContent||'')+'\n\n';
    t+='Known motor-config fields\n';
    t+='field'.padEnd(30)+snaps.map(s=>s.label.padStart(10)).join('')+'\n';
    for(const f of MC_FIELDS) t+=f.name.padEnd(30)+snaps.map(s=>(f32(s.mc,f.off).toFixed(1)+f.unit).padStart(10)).join('')+'\n';
    t+='Battery power max (≈ A × 76.6 V)'.padEnd(30)+snaps.map(s=>((f32(s.mc,17)*76.6/1000).toFixed(1)+'kW').padStart(10)).join('')+'\n';
    for(const [key,name] of [['mc','MOTOR CONFIG (0x4C)'],['ap','APP CONFIG (0x4F)']]){
      const rs=diffRanges(key);
      t+=`\n${name}: `+(snaps.length<2 ? 'need 2+ modes to compare\n' : rs.length ? `${rs.length} changed range(s)\n` : 'IDENTICAL across modes\n');
      for(const r of rs){
        t+=`  bytes ${r.a}-${r.b}\n`;
        for(const s of snaps) t+=`    ${s.label.padEnd(8)} ${hex(s[key],r.a,r.b+1)}\n`;
        for(const g of floatGuesses(key,r)) t+=`    as float @${g.o}: `+g.vals.map(v=>+v.toPrecision(5)).join('  /  ')+'\n';
      }
    }
    t+='\nRaw snapshots (hex)\n';
    for(const s of snaps){ t+=`${s.label} motor: ${hex(s.mc,0,s.mc.length)}\n${s.label} app:   ${hex(s.ap,0,s.ap.length)}\n`; }
    return t;
  }

  function draw(){
    if(!snaps.length){ out.textContent='No snapshots yet.'; return; }
    // summary table on top, full text report below
    let h='<table><tr><th style="text-align:left">field</th>'+snaps.map(s=>`<th>${s.label}</th>`).join('')+'</tr>';
    for(const f of MC_FIELDS) h+=`<tr><td style="text-align:left">${f.name}</td>`+snaps.map(s=>`<td>${f32(s.mc,f.off).toFixed(1)} ${f.unit}</td>`).join('')+'</tr>';
    h+='</table>\n\n';
    const esc=t=>t.replace(/&/g,'&amp;').replace(/</g,'&lt;');
    out.innerHTML=h+esc(report());
  }

  async function copy(){
    const t=report();
    try{ await navigator.clipboard.writeText(t); setStatus('Report copied — paste it to Claude.'); }
    catch{ // Bluefy may block the clipboard: select the text so it can be copied by hand
      out.textContent=t; const r=document.createRange(); r.selectNodeContents(out);
      const sel=getSelection(); sel.removeAllRanges(); sel.addRange(r);
      setStatus('Clipboard blocked — report text is selected, use Copy from the menu.'); }
  }

  const api={ mode:null, onReply, open(){ panel.classList.add('open'); draw(); }, close(){ panel.classList.remove('open'); } };
  $('dgRead').onclick=read;
  $('dgClear').onclick=()=>{ snaps.length=0; draw(); setStatus('Cleared.'); };
  $('dgCopy').onclick=copy;
  $('dgClose').onclick=api.close;
  $('dgConnect').onclick=()=>{ if(device?.gatt?.connected){ setStatus('Already connected.'); return; } connect().then(()=>setStatus(device?.gatt?.connected?'Connected.':'Not connected.')); };
  return api;
})();
// open the panel: long-press the clock (top right), or load the page with ?diag
{ const hit=el('rect',{x:640,y:10,width:120,height:34,fill:'transparent'});
  onPress(hit, ()=>DIAG.open(), null, 700); }
if(new URLSearchParams(location.search).has('diag')) DIAG.open();
</script>
</body>
</html>
