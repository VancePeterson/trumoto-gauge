<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cricket Gauge – Test</title>
<style>
  :root { --bg:#0d0f12; --card:#181b20; --fg:#e8eaed; --dim:#8a919c; --acc:#4fc3f7; --bad:#ef5350; --ok:#66bb6a; }
  * { box-sizing:border-box; }
  body { margin:0; padding:16px; padding-top:max(16px, env(safe-area-inset-top)); background:var(--bg); color:var(--fg);
         font-family:-apple-system, system-ui, sans-serif; }
  h1 { font-size:18px; margin:0 0 4px; }
  #fw { color:var(--dim); font-size:13px; min-height:1em; }
  .row { display:flex; gap:8px; margin:12px 0; }
  button { flex:1; font-size:17px; padding:14px; border:0; border-radius:12px; background:var(--acc); color:#000; font-weight:600; }
  button:disabled { opacity:.4; }
  #status { font-size:13px; color:var(--dim); margin-bottom:12px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .card { background:var(--card); border-radius:14px; padding:12px; }
  .card.big { grid-column:1 / -1; text-align:center; }
  .lbl { font-size:12px; color:var(--dim); text-transform:uppercase; letter-spacing:.05em; }
  .val { font-size:28px; font-weight:700; font-variant-numeric:tabular-nums; margin-top:2px; }
  .big .val { font-size:56px; }
  .unit { font-size:14px; color:var(--dim); font-weight:400; margin-left:3px; }
  #fault.bad { color:var(--bad); } #fault.ok { color:var(--ok); }
  details { margin-top:14px; color:var(--dim); font-size:12px; }
  pre { white-space:pre-wrap; word-break:break-all; font-size:11px; }
</style>
</head>
<body>
<h1>Noisy Cricket – live data test</h1>
<div id="fw"></div>
<div class="row">
  <button id="connect">Connect</button>
  <button id="disconnect" disabled>Disconnect</button>
</div>
<div id="status">Not connected. Close the TruMoto app first.</div>

<div class="grid">
  <div class="card big"><div class="lbl">Power</div><div class="val"><span id="power">–</span><span class="unit">W</span></div></div>
  <div class="card"><div class="lbl">Battery</div><div class="val"><span id="vin">–</span><span class="unit">V</span></div></div>
  <div class="card"><div class="lbl">Battery current</div><div class="val"><span id="iin">–</span><span class="unit">A</span></div></div>
  <div class="card"><div class="lbl">Motor current</div><div class="val"><span id="imot">–</span><span class="unit">A</span></div></div>
  <div class="card"><div class="lbl">Duty</div><div class="val"><span id="duty">–</span><span class="unit">%</span></div></div>
  <div class="card"><div class="lbl">eRPM</div><div class="val"><span id="erpm">–</span></div></div>
  <div class="card"><div class="lbl">Fault</div><div class="val" id="fault">–</div></div>
  <div class="card"><div class="lbl">Controller temp</div><div class="val"><span id="tfet">–</span><span class="unit">°C</span></div></div>
  <div class="card"><div class="lbl">Motor temp</div><div class="val"><span id="tmot">–</span><span class="unit">°C</span></div></div>
  <div class="card"><div class="lbl">Used</div><div class="val"><span id="wh">–</span><span class="unit">Wh</span></div></div>
  <div class="card"><div class="lbl">Regen</div><div class="val"><span id="whc">–</span><span class="unit">Wh</span></div></div>
</div>

<details>
  <summary>Debug</summary>
  <div id="rate"></div>
  <pre id="raw"></pre>
</details>

<script>
// ---- BLE / protocol constants ----
const NUS     = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
const NUS_RX  = '6e400002-b5a3-f393-e0a9-e50e24dcca9e'; // phone -> controller (write)
const NUS_TX  = '6e400003-b5a3-f393-e0a9-e50e24dcca9e'; // controller -> phone (notify)
const POLL_MS = 100;

// TruMoto shifts every standard VESC command ID by +62 (0x3E).
// READ-ONLY commands only. Do not add others: 0x43/0x44 etc. drive the motor.
const CMD_FW_VERSION = 0x3E; // std 0x00
const CMD_GET_VALUES = 0x42; // std 0x04

const FAULTS = ['NONE','OVER_VOLTAGE','UNDER_VOLTAGE','DRV','ABS_OVER_CURRENT','OVER_TEMP_FET','OVER_TEMP_MOTOR',
  'GATE_DRIVER_OVER_VOLTAGE','GATE_DRIVER_UNDER_VOLTAGE','MCU_UNDER_VOLTAGE','BOOTING_FROM_WATCHDOG_RESET',
  'ENCODER_SPI','ENCODER_SINCOS_BELOW_MIN_AMPLITUDE','ENCODER_SINCOS_ABOVE_MAX_AMPLITUDE','FLASH_CORRUPTION',
  'HIGH_OFFSET_CURRENT_SENSOR_1','HIGH_OFFSET_CURRENT_SENSOR_2','HIGH_OFFSET_CURRENT_SENSOR_3','UNBALANCED_CURRENTS',
  'BRK','RESOLVER_LOT','RESOLVER_DOS','RESOLVER_LOS','FLASH_CORRUPTION_APP_CFG','FLASH_CORRUPTION_MC_CFG',
  'ENCODER_NO_MAGNET','ENCODER_MAGNET_TOO_STRONG','PHASE_FILTER'];

// ---- CRC16 (XMODEM, as used by VESC) ----
function crc16(bytes) {
  let c = 0;
  for (const b of bytes) {
    c ^= b << 8;
    for (let i = 0; i < 8; i++) c = (c & 0x8000) ? ((c << 1) ^ 0x1021) & 0xffff : (c << 1) & 0xffff;
  }
  return c;
}
function frame(payload) {
  const p = Uint8Array.from(payload), c = crc16(p);
  return Uint8Array.from([0x02, p.length, ...p, c >> 8, c & 0xff, 0x03]);
}
const PKT_FW     = frame([CMD_FW_VERSION]); // 02 01 3E D7 9D 03
const PKT_VALUES = frame([CMD_GET_VALUES]); // 02 01 42 68 86 03

// ---- state ----
let device, rx, tx, pollTimer, busy = false;
let rxBuf = new Uint8Array(0);
let pktCount = 0, rateT0 = performance.now();
const $ = id => document.getElementById(id);
const hex = a => Array.from(a, b => b.toString(16).padStart(2, '0')).join(' ');
const setStatus = s => $('status').textContent = s;

// ---- receive: reassemble VESC frames from BLE notifications ----
function onNotify(e) {
  const chunk = new Uint8Array(e.target.value.buffer);
  const merged = new Uint8Array(rxBuf.length + chunk.length);
  merged.set(rxBuf); merged.set(chunk, rxBuf.length);
  rxBuf = merged;
  parseBuffer();
}
function parseBuffer() {
  while (rxBuf.length > 0) {
    const start = rxBuf[0];
    if (start !== 0x02 && start !== 0x03) { rxBuf = rxBuf.slice(1); continue; } // resync
    const hdr = start === 0x02 ? 2 : 3;
    if (rxBuf.length < hdr) return;
    const len = start === 0x02 ? rxBuf[1] : (rxBuf[1] << 8) | rxBuf[2];
    const total = hdr + len + 3;
    if (rxBuf.length < total) return; // wait for more chunks
    const payload = rxBuf.slice(hdr, hdr + len);
    const crc = (rxBuf[hdr + len] << 8) | rxBuf[hdr + len + 1];
    const end = rxBuf[hdr + len + 2];
    if (end === 0x03 && crc === crc16(payload)) {
      rxBuf = rxBuf.slice(total);
      handlePacket(payload);
    } else {
      rxBuf = rxBuf.slice(1); // bad frame, resync
    }
  }
}

function handlePacket(p) {
  const dv = new DataView(p.buffer, p.byteOffset, p.byteLength);
  if (p[0] === CMD_FW_VERSION) {
    let name = '', i = 3;
    while (i < p.length && p[i] !== 0) name += String.fromCharCode(p[i++]);
    $('fw').textContent = `${name} · VESC fw ${p[1]}.${String(p[2]).padStart(2, '0')}`;
  } else if (p[0] === CMD_GET_VALUES) {
    busy = false;
    pktCount++;
    let o = 1;
    const i16 = s => { const v = dv.getInt16(o) / s; o += 2; return v; };
    const i32 = s => { const v = dv.getInt32(o) / s; o += 4; return v; };
    const v = {
      tFet: i16(10), tMot: i16(10), iMot: i32(100), iIn: i32(100),
      id: i32(100), iq: i32(100), duty: i16(1000), erpm: i32(1), vin: i16(10),
      ah: i32(1e4), ahc: i32(1e4), wh: i32(1e4), whc: i32(1e4),
      tach: i32(1), tachAbs: i32(1), fault: p[o]
    };
    render(v);
    $('raw').textContent = hex(p);
  }
}

function render(v) {
  $('power').textContent = Math.round(v.vin * v.iIn);
  $('vin').textContent = v.vin.toFixed(1);
  $('iin').textContent = v.iIn.toFixed(1);
  $('imot').textContent = v.iMot.toFixed(1);
  $('duty').textContent = (v.duty * 100).toFixed(0);
  $('erpm').textContent = Math.round(v.erpm);
  $('tfet').textContent = v.tFet.toFixed(1);
  $('tmot').textContent = v.tMot.toFixed(1);
  $('wh').textContent = v.wh.toFixed(1);
  $('whc').textContent = v.whc.toFixed(1);
  const f = $('fault');
  f.textContent = FAULTS[v.fault] ?? `#${v.fault}`;
  f.className = 'val ' + (v.fault === 0 ? 'ok' : 'bad');
  const now = performance.now();
  if (now - rateT0 > 2000) {
    $('rate').textContent = `${(pktCount * 1000 / (now - rateT0)).toFixed(1)} packets/s`;
    pktCount = 0; rateT0 = now;
  }
}

// ---- send ----
async function send(pkt) {
  await rx.writeValue(pkt);
}
async function poll() {
  if (busy) { busy = false; return; } // skip one tick if a reply is late, then retry
  busy = true;
  try { await send(PKT_VALUES); } catch (e) { setStatus('Write failed: ' + e.message); }
}

// ---- connect / disconnect ----
async function connect() {
  try {
    setStatus('Choose "Cricket Sport"…');
    device = await navigator.bluetooth.requestDevice({
      filters: [{ namePrefix: 'Cricket' }, { services: [NUS] }],
      optionalServices: [NUS]
    });
    device.addEventListener('gattserverdisconnected', onDisconnected);
    setStatus('Connecting…');
    const server = await device.gatt.connect();
    const svc = await server.getPrimaryService(NUS);
    rx = await svc.getCharacteristic(NUS_RX);
    tx = await svc.getCharacteristic(NUS_TX);
    tx.addEventListener('characteristicvaluechanged', onNotify);
    await tx.startNotifications();
    await send(PKT_FW);
    pollTimer = setInterval(poll, POLL_MS);
    setStatus('Connected to ' + (device.name || 'controller'));
    $('connect').disabled = true; $('disconnect').disabled = false;
  } catch (e) {
    setStatus('Error: ' + e.message);
  }
}
function onDisconnected() {
  clearInterval(pollTimer); busy = false; rxBuf = new Uint8Array(0);
  setStatus('Disconnected');
  $('connect').disabled = false; $('disconnect').disabled = true;
}
$('connect').onclick = connect;
$('disconnect').onclick = () => device?.gatt?.connected && device.gatt.disconnect();

if (!navigator.bluetooth) setStatus('Web Bluetooth not available — open this page in Bluefy.');
</script>
</body>
</html>
