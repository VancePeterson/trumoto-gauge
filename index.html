<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Cricket Dash</title>
<style>
  html, body { margin:0; height:100%; background:#000; overflow:hidden; -webkit-user-select:none; user-select:none; }
  body { display:flex; align-items:center; justify-content:center; }
  svg { width:100vw; height:100vh; display:block; }
  text { font-family:"Avenir Next Condensed","Helvetica Neue",Arial,sans-serif; font-weight:700; fill:#e8e8e8; }
  .it { font-style:italic; }
  .dim { fill:#9a9a9a; }
  .tap { cursor:pointer; }
  #overlay { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
             background:rgba(0,0,0,.72); color:#e8e8e8; font:700 22px "Avenir Next Condensed",sans-serif; letter-spacing:.08em; }
  #overlay small { margin-top:10px; font-size:13px; color:#9a9a9a; letter-spacing:.02em; font-weight:500; text-align:center; padding:0 20px; }
  #overlay.hidden { display:none; }
</style>
</head>
<body>
<svg id="dash" viewBox="0 0 800 420" preserveAspectRatio="xMidYMid meet"></svg>
<div id="overlay"><div>TAP TO CONNECT</div><small id="ovmsg">Close the TruMoto app first. Turn phone sideways.</small></div>

<script>
// ======================= CONFIG (from your controller's motor config) =======================
const MOTOR_POLES = 8;        // 8 poles = 4 pole pairs  -> motor RPM = eRPM / 4
const GEAR_RATIO  = 6.077;    // motor : wheel
const WHEEL_DIA_M = 0.405;    // metres
const CELLS       = 21;       // 21s pack
const RPM_MAX     = 9000;     // end of RPM bar (motor RPM)
const RPM_RED     = 8000;     // start of red zone
const WARN_FET_C  = 80, WARN_MOTOR_C = 100;  // warning thresholds
const POLL_MS     = 100;
const MODE_NAMES  = {1:'C', 2:'B', 3:'A'};   // throttle switch position -> label

// ======================= BLE / PROTOCOL =======================
const NUS    = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
const NUS_RX = '6e400002-b5a3-f393-e0a9-e50e24dcca9e';
const NUS_TX = '6e400003-b5a3-f393-e0a9-e50e24dcca9e';
// TruMoto shifts standard VESC command IDs by +62. READ-ONLY commands only.
const CMD_FW_VERSION = 0x3E, CMD_GET_VALUES = 0x42;

function crc16(bytes){let c=0;for(const b of bytes){c^=b<<8;for(let i=0;i<8;i++)c=(c&0x8000)?((c<<1)^0x1021)&0xffff:(c<<1)&0xffff;}return c;}
function frame(p){p=Uint8Array.from(p);const c=crc16(p);return Uint8Array.from([2,p.length,...p,c>>8,c&255,3]);}
const PKT_FW = frame([CMD_FW_VERSION]), PKT_VALUES = frame([CMD_GET_VALUES]);

// ======================= SETTINGS (tap to toggle, remembered) =======================
const store = { get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v);}catch{return d;}},
                set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch{}} };
let useKmh = store.get('kmh', false), useF = store.get('degF', false);

// ======================= DRAW THE DASH =======================
const NS = 'http://www.w3.org/2000/svg';
const svg = document.getElementById('dash');
function el(tag, attrs, parent=svg){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);parent.appendChild(e);return e;}
function txt(x,y,s,attrs={},parent=svg){const t=el('text',{x,y,...attrs},parent);t.textContent=s;return t;}

// screen frame
el('rect',{x:6,y:4,width:788,height:412,rx:18,fill:'#050607',stroke:'#1c1f22','stroke-width':3});

// --- top status bar ---
el('rect',{x:40,y:14,width:720,height:28,fill:'none',stroke:'#cfcfcf','stroke-width':1.5});
const chipBT = chip(48,18,'BT'), chipRegen = chip(96,18,'REGEN'), chipFault = chip(170,18,'FAULT');
chipFault.box.setAttribute('fill','#d32f2f'); chipFault.label.setAttribute('fill','#fff');
const warnTxt = txt(470,36,'',{'text-anchor':'middle','font-size':17,fill:'#e53935'}); warnTxt.style.fill='#e53935';
const clockTxt = txt(750,36,'--:--',{'text-anchor':'end','font-size':20});
function chip(x,y,label){const g=el('g',{});const w=label.length*10+14;
  const box=el('rect',{x,y,width:w,height:20,fill:'#e8e8e8'},g);
  const t=txt(x+w/2,y+16,label,{'text-anchor':'middle','font-size':15},g); t.style.fill='#000';
  g.style.display='none'; return {g,box,label:t,show(v){g.style.display=v?'':'none';}};}

// --- RPM bar ---
txt(42,62,'×1000 r/min',{'font-size':12,class:'dim'});
const ARC = {cx:215, cy:340, rx:175, ry:243};   // left sweep
const LINE_END_X = 750, TOP_Y = ARC.cy-ARC.ry;  // 97
const ARC_FRAC = 4000/RPM_MAX;                  // first 4000 rpm on the curve
function thick(u){return u<ARC_FRAC ? 14+26*(u/ARC_FRAC) : 40;}
function pt(u){ // returns outer & inner points at bar position u (0..1)
  const th=thick(u);
  if(u<=ARC_FRAC){const a=Math.PI+(u/ARC_FRAC)*Math.PI/2, c=Math.cos(a), s=Math.sin(a);
    return {o:[ARC.cx+ARC.rx*c, ARC.cy+ARC.ry*s], i:[ARC.cx+(ARC.rx-th)*c, ARC.cy+(ARC.ry-th)*s], n:[c,s]};}
  const x=ARC.cx+(u-ARC_FRAC)/(1-ARC_FRAC)*(LINE_END_X-ARC.cx);
  return {o:[x,TOP_Y], i:[x,TOP_Y+th], n:[0,-1]};
}
const SEG_RPM = 250, NSEG = RPM_MAX/SEG_RPM, segs=[];
for(let k=0;k<NSEG;k++){
  const u0=k/NSEG, u1=(k+1)/NSEG, gap=0.0028;
  const a=pt(u0+gap), b=pt(u1-gap);
  const red = k*SEG_RPM >= RPM_RED;
  const p=el('polygon',{points:[a.o,b.o,b.i,a.i].map(q=>q.join(',')).join(' ')});
  segs.push({p, red});
}
for(let r=1000;r<=RPM_MAX;r+=1000){
  const q=pt(r/RPM_MAX), off=14;
  const x=q.o[0]+q.n[0]*off, y=q.o[1]+q.n[1]*off+6;
  const t=txt(x,y,String(r/1000),{'text-anchor':'middle','font-size':r/RPM_MAX<ARC_FRAC?17:20,class:'it'});
  if(r>RPM_RED) t.style.fill='#e53935';
}
function setRpm(rpm){
  const lit=rpm/SEG_RPM;
  segs.forEach((s,k)=>{const on=k<lit;
    s.p.setAttribute('fill', s.red ? (on?'#ff3b30':'#b71c1c') : (on?'#ececec':'#2b2d30'));});
}

// --- speed: 7-segment digits ---
const DIG={w:54,h:104,t:12}, SPEED_X=352, SPEED_Y=158;
const SEGMAP={0:'abcdef',1:'bc',2:'abged',3:'abgcd',4:'fgbc',5:'afgcd',6:'afgedc',7:'abc',8:'abcdefg',9:'abcdfg',' ':''};
function segPoly(s){const {w,h,t}=DIG, m=h/2, e=t/2;
  const H=(y)=>[[e,y],[t,y-e],[w-t,y-e],[w-e,y],[w-t,y+e],[t,y+e]];
  const V=(x,y0,y1)=>[[x,y0+e],[x+e,y0+t],[x+e,y1-t],[x,y1-e],[x-e,y1-t],[x-e,y0+t]];
  return {a:H(e),g:H(m),d:H(h-e),f:V(e,0,m),e:V(e,m,h),b:V(w-e,0,m),c:V(w-e,m,h)}[s];}
const digits=[];
for(let d=0;d<3;d++){
  const g=el('g',{transform:`translate(${SPEED_X+d*(DIG.w+14)},${SPEED_Y}) skewX(-7)`});
  const segsD={}; for(const s of 'abcdefg') segsD[s]=el('polygon',{points:segPoly(s).map(q=>q.join(',')).join(' ')},g);
  digits.push(segsD);
}
function setDigits(n){
  const s=String(Math.max(0,Math.min(999,Math.round(n)))).padStart(3,' ');
  digits.forEach((dg,i)=>{const on=SEGMAP[s[i]];for(const k in dg) dg[k].setAttribute('fill', on.includes(k)?'#ececec':'#0d0e10');});
}
const unitTxt = txt(SPEED_X+3*(DIG.w+14)+2, SPEED_Y+DIG.h, '', {'font-size':20,class:'tap'});

// --- power box (where the R1 shows gear) ---
el('rect',{x:352,y:290,width:196,height:58,fill:'none',stroke:'#7d7d7d','stroke-width':1.5});
txt(364,312,'POWER',{'font-size':12,class:'dim'});
const kwTxt = txt(480,340,'0.0',{'text-anchor':'middle','font-size':46,class:'it'}); kwTxt.style.fill='#2ecc71';
txt(540,340,'kW',{'text-anchor':'end','font-size':14,class:'dim'});

// --- left readouts (temps & volts) ---
const readG=el('g',{class:'tap'});
txt(104,240,'BATT',{'font-size':15},readG); const socTxt=txt(300,242,'--',{'text-anchor':'end','font-size':26,class:'it'},readG); txt(306,242,'%',{'font-size':14,class:'dim'},readG);
txt(104,272,'VOLT',{'font-size':15},readG);   const voltTxt=txt(300,274,'--.-',{'text-anchor':'end','font-size':26,class:'it'},readG); txt(306,274,'V',{'font-size':14,class:'dim'},readG);
txt(104,304,'M.TEMP',{'font-size':15},readG); const mtTxt=txt(300,306,'--',{'text-anchor':'end','font-size':26,class:'it'},readG);  const mtU=txt(306,306,'',{'font-size':14,class:'dim'},readG);
txt(104,336,'C.TEMP',{'font-size':15},readG); const ctTxt=txt(300,338,'--',{'text-anchor':'end','font-size':26,class:'it'},readG);  const ctU=txt(306,338,'',{'font-size':14,class:'dim'},readG);

// --- right ladder: battery level ---
const LAD={x:676,y:158,h:190,n:10};
el('line',{x1:LAD.x,y1:LAD.y,x2:LAD.x,y2:LAD.y+LAD.h,stroke:'#cfcfcf','stroke-width':2});
el('line',{x1:LAD.x+40,y1:LAD.y,x2:LAD.x+40,y2:LAD.y+LAD.h,stroke:'#cfcfcf','stroke-width':2});
const ladderBars=[];
for(let k=0;k<LAD.n;k++){
  const y=LAD.y+LAD.h-(k+1)*(LAD.h/LAD.n)+3;
  el('line',{x1:LAD.x-34,y1:y+LAD.h/LAD.n-3,x2:LAD.x-8,y2:y+LAD.h/LAD.n-3,stroke:'#cfcfcf','stroke-width':2});
  ladderBars.push(el('rect',{x:LAD.x+6,y,width:28,height:LAD.h/LAD.n-6}));
}
txt(LAD.x+50,LAD.y+12,'F',{'font-size':15,class:'dim'}); txt(LAD.x+50,LAD.y+LAD.h,'E',{'font-size':15,class:'dim'});


// --- bottom bar ---
el('rect',{x:80,y:362,width:640,height:28,fill:'none',stroke:'#cfcfcf','stroke-width':1.5});
const modeChip=el('rect',{x:84,y:366,width:72,height:20,fill:'#e8e8e8'}); const modeTxt=txt(120,382,'MODE-–',{'text-anchor':'middle','font-size':15}); modeTxt.style.fill='#000';
txt(170,384,'TRIP',{'font-size':15}); const tripTxt = txt(212,384,'0.00',{'font-size':19}); const tripU=txt(258,384,'',{'font-size':13,class:'dim'});
txt(300,384,'AMP',{'font-size':15});  const ampTxt=txt(372,384,'0',{'text-anchor':'end','font-size':19});
txt(402,384,'Wh',{'font-size':15});   const whTxt=txt(484,384,'0.0',{'text-anchor':'end','font-size':19});
txt(514,384,'RGN',{'font-size':15});  const rgnTxt=txt(600,384,'0.0',{'text-anchor':'end','font-size':19});
const fwTxt = txt(250,34,'',{'font-size':13,class:'dim'});

// ======================= MATH =======================
const POLE_PAIRS = MOTOR_POLES/2, WHEEL_CIRC = Math.PI*WHEEL_DIA_M;
const motorRpm = erpm => Math.abs(erpm)/POLE_PAIRS;
const speedMs  = erpm => motorRpm(erpm)/GEAR_RATIO*WHEEL_CIRC/60;
const tachToM  = t => t/(MOTOR_POLES*3)/GEAR_RATIO*WHEEL_CIRC;   // VESC tacho counts 6 per e-rev
const SOC_LUT=[[3.0,0],[3.3,5],[3.5,15],[3.6,28],[3.7,48],[3.8,64],[3.9,77],[4.0,87],[4.1,95],[4.2,100]];
function soc(vPack){const v=vPack/CELLS; if(v<=SOC_LUT[0][0])return 0;
  for(let i=1;i<SOC_LUT.length;i++){const [v1,p1]=SOC_LUT[i],[v0,p0]=SOC_LUT[i-1];
    if(v<=v1) return p0+(p1-p0)*(v-v0)/(v1-v0);} return 100;}
const temp = c => useF ? c*9/5+32 : c;

// ======================= RENDER =======================
let tripStartTach=null, socSmooth=null, last=null;
function render(v){
  last=v;
  const rpm=motorRpm(v.erpm), ms=speedMs(v.erpm);
  setRpm(rpm);
  setDigits(useKmh ? ms*3.6 : ms*2.23694);
  unitTxt.textContent = useKmh?'km/h':'mph';
  kwTxt.textContent = (v.vin*v.iIn/1000).toFixed(1);
  voltTxt.textContent = v.vin.toFixed(1);
  mtTxt.textContent = Math.round(temp(v.tMot)); ctTxt.textContent = Math.round(temp(v.tFet));
  mtU.textContent = ctU.textContent = useF?'°F':'°C';
  // battery: smooth so it doesn't jump with voltage sag
  const s=soc(v.vin); socSmooth = socSmooth===null ? s : socSmooth + (s-socSmooth)*0.02;
  socTxt.textContent = Math.round(socSmooth);
  ladderBars.forEach((b,k)=>b.setAttribute('fill', k < Math.ceil(socSmooth/10) ? (socSmooth<20?'#ff3b30':'#4fc3f7') : '#1a1c1e'));
  // trip since connect
  if(tripStartTach===null) tripStartTach=v.tachAbs;
  const m=tachToM(v.tachAbs-tripStartTach);
  tripTxt.textContent = (useKmh? m/1000 : m/1609.344).toFixed(2); tripU.textContent = useKmh?'km':'mi';
  ampTxt.textContent = Math.round(v.iIn); whTxt.textContent = v.wh.toFixed(1); rgnTxt.textContent = v.whc.toFixed(1);
  modeTxt.textContent = 'MODE-'+(MODE_NAMES[v.mode]??'–');
  chipRegen.show(v.iIn < -0.5);
  chipFault.show(v.fault!==0);
  warnTxt.textContent = v.fault!==0 ? FAULTS[v.fault]||('FAULT '+v.fault)
                      : (v.tFet>=WARN_FET_C ? 'CONTROLLER HOT' : v.tMot>=WARN_MOTOR_C ? 'MOTOR HOT' : '');
}
const FAULTS=['NONE','OVER VOLTAGE','UNDER VOLTAGE','DRV','ABS OVER CURRENT','FET OVER TEMP','MOTOR OVER TEMP',
  'GATE DRV OVER V','GATE DRV UNDER V','MCU UNDER VOLTAGE','WATCHDOG RESET','ENCODER SPI','ENCODER SINCOS LOW',
  'ENCODER SINCOS HIGH','FLASH CORRUPTION','CURRENT SENSOR 1','CURRENT SENSOR 2','CURRENT SENSOR 3','UNBALANCED CURRENTS',
  'BRK','RESOLVER LOT','RESOLVER DOS','RESOLVER LOS','FLASH APP CFG','FLASH MC CFG','ENCODER NO MAGNET','MAGNET TOO STRONG','PHASE FILTER'];

// taps: speed unit toggles mph/kmh, temps toggle °C/°F
unitTxt.addEventListener('click',e=>{e.stopPropagation();useKmh=!useKmh;store.set('kmh',useKmh);last&&render(last);});
readG.addEventListener('click',e=>{e.stopPropagation();useF=!useF;store.set('degF',useF);last&&render(last);});
setInterval(()=>{const d=new Date();clockTxt.textContent=d.getHours()+':'+String(d.getMinutes()).padStart(2,'0');},1000);
const tick=()=>{const d=new Date();clockTxt.textContent=d.getHours()+':'+String(d.getMinutes()).padStart(2,'0');}; tick();
setRpm(0); setDigits(0); unitTxt.textContent=useKmh?'km/h':'mph';

// ======================= BLE CONNECTION =======================
let device, rx, pollTimer, busy=false, rxBuf=new Uint8Array(0), wakeLock=null;
const overlay=document.getElementById('overlay'), ovmsg=document.getElementById('ovmsg');

function onNotify(e){const c=new Uint8Array(e.target.value.buffer);const m=new Uint8Array(rxBuf.length+c.length);m.set(rxBuf);m.set(c,rxBuf.length);rxBuf=m;parse();}
function parse(){
  while(rxBuf.length){
    const st=rxBuf[0]; if(st!==2&&st!==3){rxBuf=rxBuf.slice(1);continue;}
    const hdr=st===2?2:3; if(rxBuf.length<hdr)return;
    const len=st===2?rxBuf[1]:(rxBuf[1]<<8)|rxBuf[2], tot=hdr+len+3; if(rxBuf.length<tot)return;
    const p=rxBuf.slice(hdr,hdr+len), crc=(rxBuf[hdr+len]<<8)|rxBuf[hdr+len+1];
    if(rxBuf[hdr+len+2]===3&&crc===crc16(p)){rxBuf=rxBuf.slice(tot);handle(p);} else rxBuf=rxBuf.slice(1);
  }
}
function handle(p){
  const dv=new DataView(p.buffer,p.byteOffset,p.byteLength);
  if(p[0]===CMD_FW_VERSION){let n='',i=3;while(i<p.length&&p[i])n+=String.fromCharCode(p[i++]);fwTxt.textContent=n;}
  else if(p[0]===CMD_GET_VALUES){
    busy=false; let o=1;
    const i16=s=>{const v=dv.getInt16(o)/s;o+=2;return v;}, i32=s=>{const v=dv.getInt32(o)/s;o+=4;return v;};
    render({tFet:i16(10),tMot:i16(10),iMot:i32(100),iIn:i32(100),id:i32(100),iq:i32(100),duty:i16(1000),erpm:i32(1),
            vin:i16(10),ah:i32(1e4),ahc:i32(1e4),wh:i32(1e4),whc:i32(1e4),tach:i32(1),tachAbs:i32(1),fault:p[o],
            mode:p.length>=75?p[p.length-1]:null});  // TruMoto extra byte: throttle switch position 1-3
  }
}
async function poll(){ if(busy){busy=false;return;} busy=true; try{await rx.writeValue(PKT_VALUES);}catch(e){} }

async function connect(){
  if(!navigator.bluetooth){ovmsg.textContent='Web Bluetooth not available — open this page in Bluefy.';return;}
  try{
    ovmsg.textContent='Choose "Cricket Sport"…';
    device=await navigator.bluetooth.requestDevice({filters:[{namePrefix:'Cricket'},{services:[NUS]}],optionalServices:[NUS]});
    device.addEventListener('gattserverdisconnected',onDisconnected);
    ovmsg.textContent='Connecting…';
    const svc=await (await device.gatt.connect()).getPrimaryService(NUS);
    rx=await svc.getCharacteristic(NUS_RX);
    const tx=await svc.getCharacteristic(NUS_TX);
    tx.addEventListener('characteristicvaluechanged',onNotify);
    await tx.startNotifications();
    await rx.writeValue(PKT_FW);
    tripStartTach=null; socSmooth=null;
    pollTimer=setInterval(poll,POLL_MS);
    overlay.classList.add('hidden'); chipBT.show(true);
    try{ wakeLock = await navigator.wakeLock?.request('screen'); }catch{}
  }catch(e){ ovmsg.textContent='Error: '+e.message+' — tap to retry'; }
}
function onDisconnected(){
  clearInterval(pollTimer); busy=false; rxBuf=new Uint8Array(0); chipBT.show(false);
  overlay.classList.remove('hidden'); ovmsg.textContent='Disconnected — tap to reconnect';
  try{wakeLock?.release();}catch{}
}
overlay.addEventListener('click',connect);
chipBT.g.addEventListener('click',()=>device?.gatt?.connected&&device.gatt.disconnect());
</script>
</body>
</html>
